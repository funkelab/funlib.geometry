[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
name = "funlib.geometry"
description = "A package for Coordinates, Rois and common operations in Coordinate spaces."
authors = [
    { name = "Jan Funke", email = "funkej@hhmi.org" },
    { name = "William Patton", email = "pattonw@hhmi.org" },
    { name = "Caroline Malin-Mayor" },
]
license = { text = "MIT" }
readme = "README.md"
dynamic = ["version"]

classifiers = ["Programming Language :: Python :: 3"]
keywords = []
requires-python = ">=3.10"

dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
    "ty>=0.0.17",
]

[tool.setuptools.dynamic]
version = { attr = "funlib.geometry.__version__" }

[tool.setuptools.package-data]
"funlib.geometry" = ["py.typed"]

[tool.ruff]
# ruff >= 0.16 also formats Python code fences in Markdown; keep the README's
# hand-aligned result comments as they are.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# ruff's pre-0.16 default rule set, pinned so it does not drift with releases
select = ["E4", "E7", "E9", "F"]
