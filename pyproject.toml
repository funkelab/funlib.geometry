[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
name = "funlib.geometry"
description = "A package for Coordinates, Rois and common operations in Coordinate spaces."
authors = [
    { name = "Jan Funke", email = "funkej@hhmi.org" },
    { name = "William Patton", email = "pattonw@hhmi.org" },
    { name = "Caroline Malin-Mayor" },
]
license = { text = "MIT" }
readme = "README.md"
dynamic = ["version"]

classifiers = ["Programming Language :: Python :: 3"]
keywords = []
requires-python = ">=3.10"

dependencies = []

[project.urls]
Source = "https://github.com/funkelab/funlib.geometry"
Issues = "https://github.com/funkelab/funlib.geometry/issues"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    # versions come from uv.lock; `uv lock --upgrade` moves them
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[tool.setuptools.dynamic]
version = { attr = "funlib.geometry.__version__" }

[tool.setuptools.package-data]
"funlib.geometry" = ["py.typed"]

[tool.ty.src]
include = ["src", "tests"]
exclude = []  # only ever shrinks

[tool.ruff]
line-length = 88
extend-exclude = ["docs/build", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tutorials/**/*.py" = ["E402"]  # jupytext cells import mid-file
"examples/**/*.py" = ["E402"]
"__init__.py" = ["F401"]  # re-exports

[tool.coverage.run]
branch = true
source = ["funlib.geometry"]

[tool.coverage.report]
# Floor measured from the first branch-enabled run; raise it when measured
# coverage is two or more points ahead, never lower it without saying why.
fail_under = 81
show_missing = true
skip_covered = true
